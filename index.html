<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="color-scheme" content="light" />
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <meta name="theme-color" content="#F7F7F5" />

    <!-- Preloaded so the wordmark and the score plates render in their real
         faces on first paint. Without this the fallback paints first and the
         swap reflows the masthead. -->
    <link
      rel="preload"
      href="/fonts/archivo-wdth-latin.woff2"
      as="font"
      type="font/woff2"
      crossorigin
    />
    <link
      rel="preload"
      href="/fonts/plex-mono-700-latin.woff2"
      as="font"
      type="font/woff2"
      crossorigin
    />
    <meta
      name="description"
      content="Dispatch — a rebalancing board that scores every Citi Bike station 0-100 for urgency and sorts worst-first."
    />
    <title>Dispatch — Bikeshare rebalancing board</title>

    <!-- Open Graph / Twitter card for better sharing -->
    <meta property="og:title" content="Dispatch — Bikeshare rebalancing board" />
    <meta property="og:description" content="Ranks every Citi Bike station 0–100 for urgency and shows the arithmetic behind every score." />
    <meta property="og:image" content="https://city-bike-sigma.vercel.app/docs/screenshots/queue.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:image" content="https://city-bike-sigma.vercel.app/docs/screenshots/queue.png" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
