# Scaffold only — this Worker is intentionally not deployed. See README.md.
name = "dispatch-snapshots"
main = "src/index.ts"
compatibility_date = "2026-01-15"

# Every 5 minutes. The GBFS feed advertises ttl=60, so this samples well inside
# the rate at which the data actually changes without hammering the operator.
[triggers]
crons = ["*/5 * * * *"]

[[d1_databases]]
binding = "DB"
database_name = "dispatch"
database_id = "" # filled in by `wrangler d1 create dispatch`
